<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GymBroNass">
<meta name="theme-color" content="#080b10">
<link rel="apple-touch-icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAALQAAAC0CAYAAAA9zQYyAAABYklEQVR42u3BMQEAAADCoPVP7WsIoAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAeAMBuAABHgAAAABJRU5ErkJggg==">
<title>GymBroNass</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--black:#080b10;--dark:#0d1117;--card:#141820;--card2:#1c2330;--border:#1e2736;--accent:#e8f542;--a2:#42d4f5;--a3:#f5426c;--a4:#a78bfa;--muted:#4a5568;--text:#b8c4d8;--white:#eef2ff;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px);}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
html,body{height:100%;overflow:hidden;background:var(--black);}
body{font-family:'Outfit',sans-serif;color:var(--text);display:flex;flex-direction:column;position:fixed;width:100%;top:0;left:0;}
.safe-top{height:var(--st);background:var(--black);flex-shrink:0;}
.hdr{padding:10px 20px 8px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;z-index:50;}
.hdr-logo{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:3px;color:var(--white);}
.hdr-logo em{color:var(--accent);font-style:normal;}
.streak-badge{display:flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:4px 10px;font-family:'Space Mono',monospace;font-size:10px;color:var(--muted);}
.streak-badge.hot{border-color:rgba(74,222,128,.3);color:#4ade80;}
.cal-btn{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:14px;cursor:pointer;}
.cal-btn:active{transform:scale(.9);}
.day-swiper{flex:1;overflow:hidden;position:relative;}
.day-track{display:flex;height:100%;will-change:transform;transition:transform .32s cubic-bezier(.4,0,.2,1);}
.day-slide{min-width:100%;height:100%;display:flex;flex-direction:column;padding:0 16px 6px;overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.day-slide::-webkit-scrollbar{display:none;}
.day-hero{border-radius:20px;padding:20px;margin-bottom:10px;position:relative;overflow:hidden;flex-shrink:0;}
.day-hero::before{content:'';position:absolute;top:-40px;right:-40px;width:150px;height:150px;background:radial-gradient(circle,rgba(255,255,255,.07) 0%,transparent 70%);}
.dh-meta{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.45);margin-bottom:3px;}
.dh-num{font-family:'Bebas Neue',sans-serif;font-size:56px;letter-spacing:-2px;line-height:.9;color:#fff;}
.dh-title{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:1px;color:rgba(255,255,255,.92);}
.dh-focus{font-size:11px;color:rgba(255,255,255,.5);margin-top:3px;line-height:1.4;}
.dh-date{font-family:'Space Mono',monospace;font-size:8px;color:rgba(255,255,255,.35);margin-top:6px;}
.dh-tag{position:absolute;top:14px;right:14px;font-family:'Space Mono',monospace;font-size:9px;padding:3px 8px;border-radius:5px;backdrop-filter:blur(8px);}
.dh-btns{position:absolute;bottom:14px;right:14px;display:flex;gap:5px;}
.att-btn{width:30px;height:30px;border-radius:50%;border:1px solid rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;transition:all .15s;background:rgba(0,0,0,.3);}
.att-btn:active{transform:scale(.85);}
.att-went.on{background:#16a34a;border-color:#4ade80;}
.att-home.on{background:#7c3aed;border-color:#a78bfa;}
.att-rest.on{background:#0e4f6b;border-color:#42d4f5;}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:10px;flex-shrink:0;}
.card-hd{padding:12px 14px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;}
.card-hd:active{background:rgba(255,255,255,.02);}
.chd-l{display:flex;align-items:center;gap:10px;}
.chd-ico{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
.chd-name{font-size:13px;font-weight:600;color:var(--white);}
.chd-sub{font-size:10px;color:var(--muted);margin-top:1px;font-family:'Space Mono',monospace;}
.chd-arr{color:var(--muted);font-size:11px;transition:transform .2s;}
.chd-arr.o{transform:rotate(180deg);}
.card-body{display:none;border-top:1px solid var(--border);}
.card-body.o{display:block;}
.ex-item{display:grid;grid-template-columns:32px 1fr auto;gap:9px;align-items:center;padding:9px 14px;border-bottom:1px solid rgba(255,255,255,.04);}
.ex-item:last-child{border-bottom:none;}
.ex-ico{width:30px;height:30px;border-radius:7px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:13px;}
.ex-n{font-size:12px;font-weight:500;color:var(--white);}
.ex-nt{font-size:10px;color:var(--muted);margin-top:1px;line-height:1.3;}
.ex-sets{font-family:'Space Mono',monospace;font-size:10px;color:var(--accent);text-align:right;white-space:nowrap;}
.ex-sets small{display:block;color:var(--muted);font-size:8px;}
.swim-rows{padding:10px 14px;}
.swim-r{display:flex;justify-content:space-between;font-size:11px;padding:3px 0;border-bottom:1px solid rgba(66,212,245,.06);}
.swim-r:last-child{border-bottom:none;}
.swim-r span{color:var(--muted);font-size:10px;}
.nut-macros{display:flex;border-top:1px solid var(--border);}
.nut-m{flex:1;padding:8px 4px;text-align:center;border-right:1px solid var(--border);}
.nut-m:last-child{border-right:none;}
.nm-v{font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:.5px;}
.nm-l{font-size:8px;color:var(--muted);text-transform:uppercase;}
.meal-row{padding:9px 14px;border-bottom:1px solid rgba(255,255,255,.04);}
.meal-row:last-child{border-bottom:none;}
.meal-t{font-family:'Space Mono',monospace;font-size:8px;letter-spacing:2px;color:var(--accent);text-transform:uppercase;margin-bottom:3px;}
.meal-f{font-size:12px;color:var(--white);font-weight:500;}
.meal-m{font-size:10px;color:var(--muted);margin-top:2px;}
.miss-tip{display:flex;gap:9px;padding:9px 14px;border-bottom:1px solid rgba(255,255,255,.04);font-size:12px;}
.miss-tip:last-child{border-bottom:none;}
.mt-i{font-size:14px;flex-shrink:0;}
.mt-t strong{display:block;color:var(--white);font-size:11px;margin-bottom:2px;}
.mt-t span{color:var(--muted);font-size:10px;line-height:1.4;}
.tr-upload{padding:12px 14px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px;}
.up-btn{background:var(--accent);color:var(--black);border:none;border-radius:8px;padding:8px 14px;font-family:'Space Mono',monospace;font-size:10px;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0;}
.up-btn:active{transform:scale(.95);}
.up-st{font-size:10px;font-family:'Space Mono',monospace;}
.up-st.l{color:var(--a2);}.up-st.s{color:#4ade80;}.up-st.e{color:var(--a3);}
.met-row{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border);}
.met{background:var(--card);padding:11px 6px;text-align:center;}
.met-v{font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--accent);}
.met-l{font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:2px;}
.met-c{font-size:8px;margin-top:2px;}
.chart-wrap{padding:10px 14px 6px;border-top:1px solid var(--border);}
.chart-lbl{font-family:'Space Mono',monospace;font-size:8px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:5px;}
.chart-box{height:65px;position:relative;}
.chart-box svg{width:100%;height:100%;}
.chart-empty{height:55px;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--muted);font-family:'Space Mono',monospace;}
.hist-row{display:flex;align-items:center;gap:8px;padding:7px 14px;border-top:1px solid rgba(255,255,255,.04);}
.hist-d{font-family:'Space Mono',monospace;font-size:8px;color:var(--muted);width:50px;flex-shrink:0;}
.hist-ms{display:flex;gap:8px;flex:1;overflow-x:auto;scrollbar-width:none;}
.hist-ms::-webkit-scrollbar{display:none;}
.hm{flex-shrink:0;text-align:center;}
.hm .v{font-family:'Space Mono',monospace;font-size:9px;color:var(--accent);}
.hm .l{font-size:8px;color:var(--muted);}
.del-btn{background:transparent;border:none;color:var(--muted);font-size:12px;cursor:pointer;padding:3px;}
.dots-row{display:flex;justify-content:center;gap:5px;padding:5px 0;flex-shrink:0;}
.dot{width:5px;height:5px;border-radius:50%;background:var(--border);transition:all .2s;}
.dot.cur{width:16px;border-radius:3px;background:var(--accent);}
.bottom-bar{flex-shrink:0;background:rgba(8,11,16,.98);backdrop-filter:blur(20px);border-top:1px solid var(--border);padding:8px 16px calc(var(--sb)+8px);display:flex;align-items:center;gap:10px;}
.bb-days{display:flex;gap:5px;flex:1;overflow-x:auto;scrollbar-width:none;}
.bb-days::-webkit-scrollbar{display:none;}
.bb-day{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:4px 5px;border-radius:8px;min-width:34px;}
.bb-day:active{background:var(--card2);}
.bb-n{font-family:'Bebas Neue',sans-serif;font-size:14px;line-height:1;color:var(--muted);}
.bb-n.cur{color:var(--accent);}
.bb-dot{width:6px;height:6px;border-radius:50%;}
.bb-lbl{font-family:'Space Mono',monospace;font-size:7px;color:var(--muted);text-transform:uppercase;}
.bb-tr{background:var(--card);border:1px solid var(--border);border-radius:9px;padding:7px 11px;font-size:11px;cursor:pointer;font-family:'Space Mono',monospace;color:var(--muted);}
.bb-tr.on{border-color:var(--accent);color:var(--accent);}
.cal-overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,0);pointer-events:none;transition:background .3s;}
.cal-overlay.open{background:rgba(0,0,0,.75);pointer-events:all;}
.cal-sheet{position:absolute;bottom:0;left:0;right:0;background:var(--dark);border-radius:22px 22px 0 0;transform:translateY(100%);transition:transform .32s cubic-bezier(.4,0,.2,1);padding-bottom:calc(var(--sb)+16px);max-height:88vh;overflow-y:auto;}
.cal-overlay.open .cal-sheet{transform:translateY(0);}
.cal-handle{width:34px;height:4px;background:var(--border);border-radius:2px;margin:11px auto 14px;}
.cal-hdr{padding:0 18px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);}
.cal-nav{display:flex;align-items:center;gap:12px;}
.cal-nav button{background:var(--card);border:1px solid var(--border);border-radius:7px;width:30px;height:30px;color:var(--text);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.cal-nav button:active{transform:scale(.88);}
.cal-title{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1px;color:var(--white);}
.cal-close{background:var(--card2);border:none;color:var(--muted);font-size:15px;width:28px;height:28px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.view-tabs{display:flex;gap:5px;padding:8px 18px;border-bottom:1px solid var(--border);}
.vt{flex:1;background:var(--card);border:1px solid var(--border);border-radius:7px;padding:6px;font-family:'Space Mono',monospace;font-size:9px;color:var(--muted);cursor:pointer;text-align:center;}
.vt.on{background:var(--accent);color:var(--black);border-color:var(--accent);font-weight:700;}
.cal-wdays{display:grid;grid-template-columns:repeat(7,1fr);padding:8px 16px 2px;gap:2px;}
.cal-wd{text-align:center;font-family:'Space Mono',monospace;font-size:8px;color:var(--muted);}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);padding:3px 16px 14px;gap:3px;}
.cal-cell{aspect-ratio:1;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;transition:transform .1s;}
.cal-cell:active{transform:scale(.85);}
.cal-cell.empty{cursor:default;}
.cal-n{font-family:'Space Mono',monospace;font-size:10px;font-weight:700;}
.cal-cell.today-cell .cal-n{color:var(--accent);}
.cal-cell.today-cell::after{content:'';position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:3px;height:3px;border-radius:50%;background:var(--accent);}
.cal-cell.sel-cell{outline:2px solid var(--accent);outline-offset:1px;}
.leg-row{display:flex;gap:8px;padding:6px 18px 12px;flex-wrap:wrap;}
.leg-i{display:flex;align-items:center;gap:4px;font-size:9px;color:var(--muted);}
.leg-d{width:7px;height:7px;border-radius:2px;}
.setup-ov{position:fixed;inset:0;z-index:300;background:var(--black);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;text-align:center;}
.s-logo{font-family:'Bebas Neue',sans-serif;font-size:34px;letter-spacing:4px;color:var(--white);}
.s-logo em{color:var(--accent);font-style:normal;}
.s-btn{background:var(--accent);color:var(--black);border:none;border-radius:14px;padding:16px 36px;font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:2px;cursor:pointer;margin-top:28px;}
.s-btn:active{transform:scale(.96);}
.s-note{font-size:11px;color:var(--muted);margin-top:12px;font-family:'Space Mono',monospace;}
#toast{position:fixed;bottom:calc(var(--sb)+74px);left:50%;transform:translateX(-50%);background:var(--accent);color:var(--black);font-family:'Space Mono',monospace;font-size:11px;font-weight:700;padding:9px 16px;border-radius:9px;z-index:999;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;}
</style>
</head>
<body>
<div class="safe-top"></div>
<div class="hdr">
  <div class="hdr-logo">GYM<em>BRO</em>NASS</div>
  <div style="display:flex;gap:8px;align-items:center;">
    <div class="streak-badge" id="streak-badge"><span id="streak-fire">⚡</span><span id="streak-txt">0 day streak</span></div>
    <button class="cal-btn" onclick="openCal()">📅</button>
  </div>
</div>
<div class="day-swiper" id="swiper">
  <div class="day-track" id="track"></div>
</div>
<div class="dots-row" id="dots"></div>
<div class="bottom-bar">
  <div class="bb-days" id="bb-days"></div>
  <button class="bb-tr" id="tr-btn" data-action="tracker">📊</button>
</div>
<div class="cal-overlay" id="cal-ov" onclick="calOvClick(event)">
  <div class="cal-sheet" id="cal-sheet">
    <div class="cal-handle"></div>
    <div class="cal-hdr">
      <div class="cal-nav">
        <button onclick="calPrev()">‹</button>
        <div class="cal-title" id="cal-title">May 2026</div>
        <button onclick="calNext()">›</button>
      </div>
      <button class="cal-close" onclick="closeCal()">✕</button>
    </div>
    <div class="view-tabs">
      <div class="vt on" onclick="setView('month',this)">Month</div>
      <div class="vt" onclick="setView('3m',this)">3 Months</div>
      <div class="vt" onclick="setView('6m',this)">6 Months</div>
    </div>
    <div class="cal-wdays" id="cal-wdays"></div>
    <div class="cal-grid" id="cal-grid"></div>
    <div class="leg-row">
      <div class="leg-i"><div class="leg-d" style="background:#4ade80"></div>Streak 5+</div>
      <div class="leg-i"><div class="leg-d" style="background:#16a34a"></div>Going</div>
      <div class="leg-i"><div class="leg-d" style="background:#c2410c"></div>Missed</div>
      <div class="leg-i"><div class="leg-d" style="background:#dc2626"></div>4+ missed</div>
      <div class="leg-i"><div class="leg-d" style="background:#1e2736"></div>Future</div>
    </div>
  </div>
</div>
<div class="setup-ov" id="setup-ov" style="display:none">
  <div class="s-logo">GYM<em>BRO</em>NASS</div>
  <div style="font-size:36px;margin:14px 0">💪</div>
  <div style="font-size:16px;color:var(--text);font-weight:600">Welcome Mehdi</div>
  <div style="font-size:13px;color:var(--muted);line-height:1.7;margin-top:8px">Tap to set today as Day 1 of your 7-week programme. Your plan will follow you from here.</div>
  <button class="s-btn" onclick="startDay1()">START TODAY</button>
  <div class="s-note">Day 1 = today · 49 days total · 7 weeks</div>
</div>
<input type="file" id="pdf-in" accept=".pdf,image/*" style="display:none">
<div id="toast"></div>

// TIME-OF-DAY NUTRITION — what to eat RIGHT NOW
function getTimeNutrition(nutKey){
const h=new Date().getHours();
const n=NUT[nutKey]||NUT.rest;
let now,reason;
if(h>=5&&h<9){now=n.meals[0];reason=‘Breakfast window — fuel up’;}
else if(h>=9&&h<11){now={t:‘🕙 Mid-morning’,f:‘2 tortillas + 1 egg + tuna if not eaten yet’,m:‘Keep protein coming’};reason=‘Mid-morning top-up’;}
else if(h>=11&&h<14){now=n.meals.find(m=>m.t.includes(‘Lunch’))||n.meals[1];reason=‘Lunch window — big protein hit’;}
else if(h>=14&&h<16){now={t:‘⏰ Post-lunch’,f:‘Water + creatine 5g if not done yet’,m:‘Digestion + hydration window’};reason=‘Creatine + hydration’;}
else if(h>=16&&h<18){now=n.meals.find(m=>m.t.includes(‘Snack’))||{t:‘🥜 Snack time’,f:‘2 tortillas + egg + tuna’,m:‘~380 kcal · 35g protein’};reason=‘Pre-evening fuel’;}
else if(h>=18&&h<21){now=n.meals.find(m=>m.t.includes(‘Dinner’))||n.meals[n.meals.length-1];reason=‘Dinner window — last big meal’;}
else if(h>=21&&h<23){now={t:‘🌙 Late evening’,f:‘3 hard boiled eggs or protein shake’,m:‘~210 kcal · slow protein before bed’};reason=‘Late protein — feeds muscles overnight’;}
else{now={t:‘🌑 Night’,f:‘Protein shake if hungry · otherwise sleep’,m:‘Sleep is gains — don't eat heavy’};reason=‘Recovery window — prioritise sleep’;}
return {now,reason};
}

function dayColor(i){
const a=getAtt(i);
if(!a){
if(!S.day1) return ‘#1e2736’;
const d=new Date(S.day1);d.setDate(d.getDate()+i);d.setHours(0,0,0,0);
const t=new Date();t.setHours(0,0,0,0);
return d<t?‘rgba(90,100,120,.35)’:’#1e2736’;
}
if(a.state===‘went’){
let st=0;for(let j=i;j>=0;j–){const aj=getAtt(j);if(aj&&aj.state===‘went’)st++;else break;}
if(st>=5)return ‘#4ade80’;if(st===4)return ‘#22c55e’;if(st===3)return ‘#16a34a’;if(st===2)return ‘#1e6b2e’;return ‘#2d4a2d’;
}
if(a.state===‘home’) return ‘#5b21b6’;
if(a.state===‘rest’) return ‘#0e4f6b’;
return ‘#1e2736’;
}

function dayDateStr(i){
if(!S.day1) return ‘’;
const d=new Date(S.day1);d.setDate(d.getDate()+i);
return d.toLocaleDateString(‘en-GB’,{weekday:‘short’,day:‘numeric’,month:‘short’});
}

function buildSlides(){
_cardIdx=0;
const track=document.getElementById(‘track’);track.innerHTML=’’;
PLAN.forEach((p,i)=>{
const slide=document.createElement(‘div’);
slide.className=‘day-slide’;slide.id=‘sl’+i;
slide.innerHTML=slideHTML(p,i);
track.appendChild(slide);
});
}

function slideHTML(p,i){
const a=getAtt(i),ts=TAGS[p.type]||TAGS.rest;
const state=a?a.state:null; // ‘went’,‘home’,‘rest’, or null
const skipped=state===‘home’;
const isRest=state===‘rest’;
let h=`<div class="day-hero" style="background:${BG[p.type]||BG.rest}"> <div class="dh-meta">Week ${p.w} · Day ${p.d} of 49</div> <div class="dh-num">${p.d}</div> <div class="dh-title">${p.ti}</div> <div class="dh-focus">${p.fo}</div> ${S.day1?`<div class="dh-date">${dayDateStr(i)}</div>`:’’}
<div class="dh-tag" style="background:${ts.bg};color:${ts.c}">${p.tag} ${p.lbl}</div>
<div class="dh-btns">
<div class="att-btn att-went ${a&&a.state==='went'?'on':''}" data-action="att" data-idx="${i}" data-state="went">✓</div>
<div class="att-btn att-home ${a&&a.state==='home'?'on':''}" data-action="att" data-idx="${i}" data-state="home">🏠</div>
<div class="att-btn att-rest ${a&&a.state==='rest'?'on':''}" data-action="att" data-idx="${i}" data-state="rest">😴</div>
</div>

  </div>`;

if(skipped){
// HOME DAY — missed gym, doing home circuit
h+=card(‘🏠’,‘Home Day — Love Handles’,‘Ab wheel + obliques · 15-20 min · no gym needed’,‘rgba(167,139,250,.08)’,HOME_TIPS+exList(HOME));
} else if(isRest) {
// FULL REST DAY
h+=`<div class="card"><div style="padding:16px 14px;font-size:13px;color:var(--muted);line-height:1.9">😴 <strong style="color:var(--a2)">Full Rest Day.</strong><br>🛌 No training today — intentional recovery.<br>💊 Creatine 5g even on rest days.<br>💧 Hydrate well — add salt if you drank.<br>🧠 Muscle grows during rest, not during training.</div></div>`;
} else {
if(p.sw) h+=card(‘🏊’,‘Swim Session’,p.sw[0]?.[1]||’’,‘rgba(66,212,245,.07)’,`<div class="swim-rows">${p.sw.map(r=>`<div class="swim-r">${r[0]}<span>${r[1]}</span></div>`).join('')}</div>`);
if(p.ex&&p.ex.length) h+=card(p.tag,p.ex.length+’ Exercises’,p.ex.slice(0,3).map(e=>e[1]).join(’ · ‘)+(p.ex.length>3?’…’:’’),’’,exList(p.ex));
if(p.type===‘rest’) h+=`<div class="card"><div style="padding:14px;font-size:13px;color:var(--muted);line-height:1.9">🛌 Full rest. Walk if you want.<br>💊 Creatine 5g even today.<br>💧 Hydrate — add salt if drank.<br>📋 Next: Day ${Math.min(p.d+1,49)}</div></div>`;
}

const nutKey = state===‘home’?‘home’: state===‘rest’?‘rest’: (p.nut||‘rest’);
const n=NUT[nutKey]||NUT.rest;
const {now,reason}=getTimeNutrition(nutKey);
const nowCard=`<div style="background:rgba(232,245,66,.06);border-bottom:1px solid rgba(232,245,66,.12);padding:12px 14px;"><div style="font-family:'Space Mono',monospace;font-size:8px;letter-spacing:2px;color:var(--accent);text-transform:uppercase;margin-bottom:5px;">⚡ EAT THIS NOW · ${reason}</div><div style="font-size:13px;color:var(--white);font-weight:600">${now.f}</div><div style="font-size:10px;color:var(--muted);margin-top:3px">${now.m}</div></div>`;
h+=card(‘🥗’,‘Nutrition — ‘+n.lbl,n.p+’ protein · ‘+n.c+’ carbs · ‘+n.k+’ kcal’,’’,nowCard+`<div class="nut-macros"><div class="nut-m"><div class="nm-v" style="color:var(--accent)">${n.p}</div><div class="nm-l">Protein</div></div><div class="nut-m"><div class="nm-v" style="color:var(--a2)">${n.c}</div><div class="nm-l">Carbs</div></div><div class="nut-m"><div class="nm-v" style="color:var(--a4)">${n.f}</div><div class="nm-l">Fat</div></div><div class="nut-m"><div class="nm-v" style="color:var(--a3)">${n.k}</div><div class="nm-l">kcal</div></div></div>${n.meals.map(m=>`<div class="meal-row"><div class="meal-t">${m.t}</div><div class="meal-f">${m.f}</div><div class="meal-m">${m.m}</div></div>`).join('')}`);

if(showTr) h+=trackerHTML();
h+=’<div style="height:16px"></div>’;
return h;
}

let _cardIdx=0;
function card(ico,name,sub,bg,bodyHTML){
const id=‘card-’+(_cardIdx++);
return `<div class="card"><div class="card-hd" data-action="tog" data-id="${id}"><div class="chd-l"><div class="chd-ico" style="${bg?'background:'+bg:''}">${ico}</div><div><div class="chd-name">${name}</div>${sub?`<div class="chd-sub">${sub}</div>`:''}</div></div><div class="chd-arr" id="arr-${id}">▼</div></div><div class="card-body" id="${id}">${bodyHTML}</div></div>`;
}

function exList(exs){
return `<div>${exs.map(([ico,n,nt,sets,rest])=>`<div class="ex-item"><div class="ex-ico">${ico}</div><div><div class="ex-n">${n}</div><div class="ex-nt">${nt}</div></div><div class="ex-sets">${sets}<small>${rest}</small></div></div>`).join('')}</div>`;
}

function tog(id){
const b=document.getElementById(id);const a=document.getElementById(‘arr-’+id);
if(b){b.classList.toggle(‘o’);if(a)a.classList.toggle(‘o’);}
}

function markAtt(i,state){
const k=attKey(i);if(!k)return;
const ex=S.att[k];
// Toggle off if same state tapped again
if(ex&&ex.state===state) delete S.att[k];
else S.att[k]={state,d:PLAN[i].d};
save();
_cardIdx=0;
const sl=document.getElementById(‘sl’+i);if(sl)sl.innerHTML=slideHTML(PLAN[i],i);
buildBB();buildDots();renderStreak();
if(calOpen)renderCalGrid();
const msgs={went:‘💪 Day ‘+(i+1)+’ logged!’,home:‘🏠 Home day — circuit below’,rest:‘😴 Rest day saved’};
showToast(msgs[state]||‘Updated’);
}

function buildBB(){
const c=document.getElementById(‘bb-days’);
const s=Math.max(0,S.idx-3),e=Math.min(48,S.idx+10);
let h=’’;
for(let i=s;i<=e;i++){
const p=PLAN[i],col=dayColor(i),cur=i===S.idx;
h+=`<div class="bb-day" data-action="go" data-idx="${i}"> <div class="bb-n ${cur?'cur':''}">${p.d}</div> <div class="bb-dot" style="background:${col};${cur?'width:10px;border-radius:5px;':''}"></div> <div class="bb-lbl">${p.tag}</div> </div>`;
}
c.innerHTML=h;
document.getElementById(‘tr-btn’).className=‘bb-tr’+(showTr?’ on’:’’);
}

function buildDots(){
const c=document.getElementById(‘dots’);
const ws=Math.floor(S.idx/7)*7;
let h=’’;
for(let i=ws;i<Math.min(ws+7,49);i++){
const a=getAtt(i),cur=i===S.idx;
let cls=‘dot’+(cur?’ cur’:’’);
const col=a?dayColor(i):’’;
h+=`<div class="${cls}" style="${col?'background:'+col:''}"></div>`;
}
c.innerHTML=h;
}

function go(idx,anim){
idx=Math.max(0,Math.min(48,idx));S.idx=idx;save();
const tr=document.getElementById(‘track’);
tr.style.transition=anim?‘transform .32s cubic-bezier(.4,0,.2,1)’:‘none’;
tr.style.transform=`translateX(-${idx*100}%)`;
buildDots();buildBB();
}

function renderStreak(){
let st=0;
for(let i=S.idx;i>=0;i–){const a=getAtt(i);if(a&&a.state===‘went’)st++;else break;}
const b=document.getElementById(‘streak-badge’);
const f=document.getElementById(‘streak-fire’);
const t=document.getElementById(‘streak-txt’);
if(st>0){b.className=‘streak-badge hot’;f.textContent=‘🔥’;t.textContent=st+’ day streak’;}
else{b.className=‘streak-badge’;f.textContent=‘⚡’;t.textContent=‘No streak yet’;}
}

function setupSwipe(){
const sw=document.getElementById(‘swiper’);
let sx=0,sy=0,drag=false,dx=0;
sw.addEventListener(‘touchstart’,e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;drag=true;dx=0;document.getElementById(‘track’).style.transition=‘none’;},{passive:true});
sw.addEventListener(‘touchmove’,e=>{if(!drag)return;dx=e.touches[0].clientX-sx;const dy=e.touches[0].clientY-sy;if(Math.abs(dy)>Math.abs(dx)*1.4)return;const tr=document.getElementById(‘track’);tr.style.transform=`translateX(calc(-${S.idx*100}% + ${dx}px))`;},{passive:true});
sw.addEventListener(‘touchend’,e=>{if(!drag)return;drag=false;if(dx<-60&&S.idx<48)go(S.idx+1,true);else if(dx>60&&S.idx>0)go(S.idx-1,true);else go(S.idx,true);},{passive:true});

// EVENT DELEGATION — handles all taps on dynamically rendered elements
document.body.addEventListener(‘click’,e=>{
const el=e.target.closest(’[data-action]’);
if(!el) return;
const action=el.dataset.action;
if(action===‘att’){
e.stopPropagation();
markAtt(parseInt(el.dataset.idx), el.dataset.state);
}
if(action===‘tog’){
const id=el.dataset.id;
const body=document.getElementById(id);
const arr=document.getElementById(‘arr-’+id);
if(body){body.classList.toggle(‘o’);if(arr)arr.classList.toggle(‘o’);}
}
if(action===‘go’){
go(parseInt(el.dataset.idx),true);
}
if(action===‘caljump’){
calJump(parseInt(el.dataset.idx));
}
if(action===‘dele’){
delE(parseInt(el.dataset.idx));
}
if(action===‘pdf’){
document.getElementById(‘pdf-in’).click();
}
if(action===‘tracker’){
toggleTracker();
}
});
}

function toggleTracker(){
showTr=!showTr;
buildSlides();go(S.idx,false);
if(showTr) setTimeout(renderCharts,80);
}

function trackerHTML(){
const e=entries[0];
return `<div class="card"><div class="card-hd" onclick="tog('tr-body')"><div class="chd-l"><div class="chd-ico">📊</div><div><div class="chd-name">Body Tracker</div><div class="chd-sub">${entries.length} entr${entries.length===1?‘y’:‘ies’} · tap to open</div></div></div><div class="chd-arr" id="arr-tr-body">▼</div></div>

  <div class="card-body" id="tr-body">
    <div class="tr-upload"><button class="up-btn" data-action="pdf">📄 Upload PDF</button><div class="up-st" id="up-st"></div></div>
    <div class="met-row">
      <div class="met"><div class="met-v" id="t-w">${e?.weight_kg?.toFixed(1)||'—'}</div><div class="met-l">Weight kg</div></div>
      <div class="met"><div class="met-v" id="t-f">${e?.body_fat_percent?e.body_fat_percent.toFixed(1)+'%':'—'}</div><div class="met-l">Body Fat</div></div>
      <div class="met"><div class="met-v" id="t-m">${e?.muscle_mass_kg?.toFixed(1)||'—'}</div><div class="met-l">Muscle kg</div></div>
    </div>
    <div class="chart-wrap"><div class="chart-lbl">Body Fat % Trend</div><div class="chart-box"><svg id="c-fat"></svg><div class="chart-empty" id="ce-fat" style="${entries.length>=2?'display:none':''}">Upload PDFs to see trend</div></div></div>
    <div class="chart-wrap"><div class="chart-lbl">Muscle Mass Trend (kg)</div><div class="chart-box"><svg id="c-muscle"></svg><div class="chart-empty" id="ce-muscle" style="${entries.length>=2?'display:none':''}">Upload PDFs to see trend</div></div></div>
    ${entries.slice(0,5).map((en,i)=>`<div class="hist-row"><div class="hist-d">${new Date(en.date).toLocaleDateString('en-GB',{day:'numeric',month:'short'})}</div><div class="hist-ms">${en.weight_kg!=null?`<div class="hm"><div class="v">${en.weight_kg.toFixed(1)}</div><div class="l">kg</div></div>`:''} ${en.body_fat_percent!=null?`<div class="hm"><div class="v">${en.body_fat_percent.toFixed(1)}%</div><div class="l">fat</div></div>`:''} ${en.muscle_mass_kg!=null?`<div class="hm"><div class="v">${en.muscle_mass_kg.toFixed(1)}</div><div class="l">muscle</div></div>`:''}</div><button class="del-btn" data-action="dele" data-idx="${i}">🗑</button></div>`).join('')}
  </div></div>`;
}

function renderCharts(){
drawChart(‘c-fat’,‘ce-fat’,entries.map(e=>e.body_fat_percent).filter(v=>v!=null).reverse(),’#f5426c’);
drawChart(‘c-muscle’,‘ce-muscle’,entries.map(e=>e.muscle_mass_kg).filter(v=>v!=null).reverse(),’#e8f542’);
}

function drawChart(sid,eid,vals,col){
const svg=document.getElementById(sid);const em=document.getElementById(eid);
if(!svg)return;
if(vals.length<2){svg.style.display=‘none’;if(em)em.style.display=‘flex’;return;}
svg.style.display=‘block’;if(em)em.style.display=‘none’;
const W=300,H=62,P=8;
const mn=Math.min(…vals)-(Math.max(…vals)-Math.min(…vals))*.2;
const mx=Math.max(…vals)+(Math.max(…vals)-Math.min(…vals))*.2;
const rng=mx-mn||1;
const pts=vals.map((v,i)=>`${P+(i/(vals.length-1))*(W-P*2)},${H-P-((v-mn)/rng)*(H-P*2)}`);
svg.innerHTML=`<defs><linearGradient id="g${sid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${col}" stop-opacity=".3"/><stop offset="100%" stop-color="${col}" stop-opacity="0"/></linearGradient></defs> <path d="M ${pts[0]} L ${pts.join(' L ')} L ${P+(W-P*2)},${H} L ${P},${H} Z" fill="url(#g${sid})"/> <path d="M ${pts.join(' L ')}" stroke="${col}" stroke-width="2" fill="none" stroke-linecap="round"/> ${vals.map((v,i)=>{const x=P+(i/(vals.length-1))*(W-P*2);const y=H-P-((v-mn)/rng)*(H-P*2);return `<circle cx="${x}" cy="${y}" r="2.5" fill="${col}"/><text x="${x}" y="${y-5}" text-anchor="middle" fill="${col}" font-size="7.5" font-family="Space Mono">${v.toFixed(1)}</text>`;}).join('')}`;
}

function delE(i){if(!confirm(‘Delete?’))return;entries.splice(i,1);saveE();buildSlides();go(S.idx,false);setTimeout(renderCharts,80);}

function setupPDF(){
document.getElementById(‘pdf-in’).addEventListener(‘change’,async e=>{
const f=e.target.files[0];if(f){await procPDF(f);e.target.value=’’;}
});
}

function setUpSt(msg,cls){document.querySelectorAll(’.up-st’).forEach(el=>{el.className=’up-st ’+cls;el.textContent=msg;});}

async function procPDF(file){
setUpSt(‘🔄 AI reading…’,‘l’);
try{
const b64=await toB64(file);
const isPDF=file.type===‘application/pdf’||file.name?.endsWith(’.pdf’);
const mt=isPDF?‘application/pdf’:(file.type||‘image/jpeg’);
setUpSt(‘🧠 Extracting…’,‘l’);
const content=isPDF
?[{type:‘document’,source:{type:‘base64’,media_type:‘application/pdf’,data:b64}},{type:‘text’,text:‘Extract from this body analysis PDF. Return ONLY JSON: {“weight_kg”:null,“body_fat_percent”:null,“muscle_mass_kg”:null,“visceral_fat_level”:null,“bmi”:null,“basal_metabolism_kcal”:null,“body_fluids_percent”:null,“metabolic_age”:null}. Replace nulls with actual values. No markdown.’}]
:[{type:‘image’,source:{type:‘base64’,media_type:mt,data:b64}},{type:‘text’,text:‘Extract from this body analysis image. Return ONLY JSON: {“weight_kg”:null,“body_fat_percent”:null,“muscle_mass_kg”:null,“visceral_fat_level”:null,“bmi”:null,“basal_metabolism_kcal”:null,“body_fluids_percent”:null,“metabolic_age”:null}. Replace nulls with actual values. No markdown.’}];
const res=await fetch(‘https://api.anthropic.com/v1/messages’,{method:‘POST’,headers:{‘Content-Type’:‘application/json’},body:JSON.stringify({model:‘claude-sonnet-4-20250514’,max_tokens:1000,messages:[{role:‘user’,content}]})});
if(!res.ok)throw new Error(‘API ‘+res.status);
const data=await res.json();
const txt=data.content.filter(b=>b.type===‘text’).map(b=>b.text).join(’’);
const m=JSON.parse(txt.replace(/`json|`/g,’’).trim());
entries.unshift({date:new Date().toISOString(),…m});saveE();
setUpSt(‘✅ Done!’,‘s’);
buildSlides();go(S.idx,false);setTimeout(renderCharts,80);
showToast(‘✅ Body analysis imported!’);
setTimeout(()=>setUpSt(’’,’’),3000);
}catch(err){console.error(err);setUpSt(‘❌ Try a photo instead’,‘e’);}
}

function toB64(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(’,’)[1]);r.onerror=rej;r.readAsDataURL(f);});}

function openCal(){calM=new Date();calOpen=true;renderCalWdays();renderCalGrid();document.getElementById(‘cal-ov’).classList.add(‘open’);}
function closeCal(){document.getElementById(‘cal-ov’).classList.remove(‘open’);calOpen=false;}
function calOvClick(e){if(e.target===document.getElementById(‘cal-ov’))closeCal();}
function calPrev(){calM.setMonth(calM.getMonth()-1);renderCalGrid();}
function calNext(){calM.setMonth(calM.getMonth()+1);renderCalGrid();}
function setView(v,btn){calV=v;document.querySelectorAll(’.vt’).forEach(b=>b.classList.remove(‘on’));btn.classList.add(‘on’);renderCalGrid();}

function renderCalWdays(){
const c=document.getElementById(‘cal-wdays’);
c.innerHTML=[‘Mon’,‘Tue’,‘Wed’,‘Thu’,‘Fri’,‘Sat’,‘Sun’].map(d=>`<div class="cal-wd">${d}</div>`).join(’’);
}

function renderCalGrid(){
const grid=document.getElementById(‘cal-grid’);
const title=document.getElementById(‘cal-title’);
const today=new Date();today.setHours(0,0,0,0);
const day1=S.day1?new Date(S.day1):null;
const months=calV===‘month’?1:calV===‘3m’?3:6;
title.textContent=calM.toLocaleDateString(‘en-GB’,{month:‘long’,year:‘numeric’})+(months>1?’ — ‘+new Date(calM.getFullYear(),calM.getMonth()+months-1,1).toLocaleDateString(‘en-GB’,{month:‘long’,year:‘numeric’}):’’);
let html=’’;
for(let m=0;m<months;m++){
const yr=calM.getFullYear(),mo=calM.getMonth()+m;
const first=new Date(yr,mo,1),last=new Date(yr,mo+1,0);
if(months>1) html+=`<div style="grid-column:1/-1;padding:6px 0 2px;font-family:'Space Mono',monospace;font-size:8px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;">${first.toLocaleDateString('en-GB',{month:'long',year:'numeric'})}</div>`;
let pad=(first.getDay()+6)%7;
for(let p=0;p<pad;p++) html+=`<div class="cal-cell empty"></div>`;
for(let day=1;day<=last.getDate();day++){
const date=new Date(yr,mo,day);date.setHours(0,0,0,0);
const isToday=date.getTime()===today.getTime();
let planIdx=-1,col=’#1e2736’;
if(day1){
const diff=Math.round((date-day1)/(1000*60*60*24));
if(diff>=0&&diff<49){planIdx=diff;col=dayColor(diff);}
}
const isCur=planIdx===S.idx;
const sz=months>1?‘8’:‘10’;
html+=`<div class="cal-cell ${planIdx>=0?'plan':'no-plan'} ${isToday?'today-cell':''} ${isCur?'sel-cell':''}" style="background:${col}" ${planIdx>=0?`data-action=“caljump” data-idx=”${planIdx}”`:''}> <span class="cal-n" style="font-size:${sz}px;color:${col==='#1e2736'?'var(--muted)':'rgba(255,255,255,.9)'}">${day}</span> ${planIdx>=0&&PLAN[planIdx]?`<span style="font-size:${months>1?'6':'7'}px;color:rgba(255,255,255,.45)">${PLAN[planIdx].tag}</span>`:''} </div>`;
}
}
grid.innerHTML=html;
}

function calJump(i){closeCal();go(i,true);}

function showToast(msg){const t=document.getElementById(‘toast’);t.textContent=msg;t.style.opacity=‘1’;setTimeout(()=>{t.style.opacity=‘0’;},2500);}
</script>

</body>
